# WRITTEN EXCLUSIONS: what the connector deliberately does not reach, and why.
# Every reason is at least twenty characters (tests/connector-coverage.test.js).
#
# functions   a database function the app calls that gets no tool
# edge        a Supabase Edge Function the app invokes
# routes      a Vercel function under api/
# table_writes  a direct .from(table).insert/update/upsert/delete in src/ or
#               api/, by file, table and operation, with how many there are.
#               A new one (or one more of the same) reddens the coverage test.
# storage     a direct storage upload or remove

functions:
  family_call: "acts as whichever family holds the private link token, not as the signed-in account"
  hub_add_parent: "acts as whichever family holds the event link token, not as the signed-in account"
  hub_household_open: "acts as whichever family holds the event link token, not as the signed-in account"
  hub_remove_family: "acts as whichever family holds the event link token, not as the signed-in account"
  hub_remove_guardian: "acts as whichever family holds the event link token, not as the signed-in account"
  hub_join: "the open sign-up form a family fills in for its own student; nothing staff do"
  claim_profile: "runs once at every sign-in to settle the signed-in account's own approval; not an action"
  get_calendar_token: "reads the calendar feed secret; a secret is never handed to a chat"
  rotate_calendar_token: "replaces the signed-in account's private calendar feed link; a secret is never handed to a chat"
  register_driver_document: "records an uploaded license or insurance photo, and the connector carries no file bytes"

edge:
  calendar-feed: "a calendar feed URL a phone calendar subscribes to; not an action"
  parent-response: "the public parent questionnaire, answered by a parent with the link; not an action"
  event-family: "a family's own event page by link, plus the staff mail queue drain; next connector ledger as a hand entry"
  discord-announce: "posts to the team Discord, which messages people outside the app; next connector ledger as a hand entry at confirm"
  invite-member: "emails an invite to someone outside the app; next connector ledger as a hand entry at confirm"
  send-approval-email: "a courtesy email sent after an access request is approved; it follows approve_access_request"

routes:
  api/discord-week-ahead.js: "the Sunday Discord schedule post, run by the Vercel cron with its own secret; not a person's action"


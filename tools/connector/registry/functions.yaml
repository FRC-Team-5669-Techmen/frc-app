# HAND-WRITTEN FUNCTION ENTRIES. A database function named here replaces its
# generated entry: its level, its words for find_tool, and its undo.
#
# Levels (enforced by the server, never by a prompt):
#   read     runs at once, as him, writes nothing
#   undo     runs and is logged; names its reverse
#   confirm  always previews first; writes only on a second call with the
#            confirm_token, within ten minutes, identical arguments
#
# Anything that deletes, lowers a member's hours, removes a role or member, or
# messages people outside the app is confirm. A write with no reverse is
# confirm. Every function the app calls and nobody names here gets a generated
# entry: read when its body writes nothing, transitively, otherwise confirm.

staff_add_hour_adjustment:
  describe: Add or take away a member's hours in one category, with a reason.
  level_when:
    - {if: "p_hours > 0", level: undo}
    - {else: confirm}
  undo:
    - function: staff_add_hour_adjustment
      args:
        p_member: $args.p_member
        p_category: $args.p_category
        p_hours: {negate: $args.p_hours}
        p_reason: {concat: ["Undo through Claude: ", $args.p_reason]}

admin_set_member_role:
  describe: Give a member a team role, or take one away.
  level_when:
    - {if: "p_grant = true", level: undo}
    - {else: confirm}
  # Giving a role the member did not hold is taken back by removing it;
  # taking away a role the member held is undone by giving it back (ledger
  # 0014: found live, a removal had no undo and its preview named no row).
  # A grant of a role already held, or a removal of one not held, changed
  # nothing and offers no reverse.
  undo:
    - function: admin_set_member_role
      when: ["$args.p_grant", "!$before.had"]
      args:
        p_member: $args.p_member
        p_role: $args.p_role
        p_grant: false
    - function: admin_set_member_role
      when: ["!$args.p_grant", "$before.had"]
      args:
        p_member: $args.p_member
        p_role: $args.p_role
        p_grant: true
  before: {rpc: admin_get_members, find: {id: $args.p_member}, has: {roles: $args.p_role}}

feedback_set_status:
  describe: Move feedback reports to a status.
  level: undo
  undo:
    - function: feedback_restore_status
      args:
        p_items: {rows: $result, pick: {id: id, status: previous_status, reviewed_by: previous_reviewed_by, reviewed_at: previous_reviewed_at}}
        p_from: $args.p_status

feedback_restore_status:
  describe: Put feedback reports back to the status they had before a move.
  level: confirm

approve_signout:
  describe: Approve a pending sign-out; the member's hours stop at the approval. There is no un-approve.
  level: confirm

connector_report_gap:
  describe: File what the app cannot do to the feedback inbox, marked from the connector.
  connector_only: true
  level: undo
  undo:
    - function: feedback_set_status
      args:
        p_ids: [$result]
        p_status: wont_do

admin_get_members:
  describe: Every member with their email, status, roles and sub-teams (admin only).
  level: read

member_standing:
  describe: A member's standing, this week's hours against what is required, and this month's meetings.
  level: read

# The connector's own switch and connections (the /connector page calls these).
connector_admin_state:
  describe: Whether the connector is on, who may connect, and every connection with when it was last used.
  level: read
connector_admin_audit:
  describe: The connector's audit log, every change made through Claude, newest first.
  level: read
connector_admin_set_enabled:
  describe: Switch the connector on or off. Off ends this chat's access until it is switched on in the app.
  level: confirm
connector_admin_disconnect:
  describe: Disconnect one Claude connection.
  level: confirm
connector_admin_disconnect_all:
  describe: Disconnect every Claude connection, this one included.
  level: confirm

# Ledger 0014: the schedule, Part B roster edits.
schedule_create_event:
  describe: Add an event to the team schedule.
  level: undo
  undo:
    - function: schedule_delete_event
      args:
        p_event: $result.id

admin_set_member_name:
  describe: Set the real name a member shows under on the roster, and their nickname if given. Undo puts the old name back.
  level: undo
  undo:
    - function: admin_set_member_name
      when: "$result.nickname_given"
      args:
        p_member: $args.p_member
        p_full_name: $result.previous_full_name
        p_nickname: $result.previous_nickname
    - function: admin_set_member_name
      when: "!$result.nickname_given"
      args:
        p_member: $args.p_member
        p_full_name: $result.previous_full_name

feedback_reply:
  describe: Answer a feedback report; the sender is told in the app, by email and by push. Always asks first.
  level: confirm

staff_send_trip_link:
  describe: Email one family their trip sign-up link again, a fresh link to each email on the family, or to one of them. Always asks first.
  level: confirm

admin_merge_member:
  describe: Merge a duplicate account into the member real account, moving everything it has. Always asks first and lists what moves.
  level: confirm

# The invoker delegates to a private audited writer. Explicit level is required
# because the source scanner does not inspect private-schema function bodies.
scouting_save:
  describe: Save or correct a scouting claim, observation, assignment, pit message, team record or personal pick list, preserving its history.
  level: confirm

# ledger 0017: the battery log (0026). Charge state is undoable (the reverse
# sets the state it had, which the function answers); a logged run is
# confirm, because nothing in the app removes a run (runs are a record, and a
# wrong one is corrected, not deleted).
battery_set_charge:
  describe: Set a battery's charge state (charged, charging, needs charge, in the robot). Undo puts the old state back.
  level: undo
  undo:
    - function: battery_set_charge
      args:
        p_battery: $args.p_battery
        p_state: $result.previous

robot_match_import:
  describe: Import one robot match file into the match log, linking its crew, battery, auto and event, and logging the battery run and drive time once. Always asks first.
  level: confirm

robot_match_update:
  describe: Change a robot match's crew, battery, auto, event, notes, video, score, ranking points, TOWER or fouls. Always asks first.
  level: confirm

robot_match_fill_official:
  describe: Fill a robot match's alliance score and ranking points from the event's Blue Alliance results. Always asks first.
  level: confirm

battery_log_run:
  describe: Log one use of a battery with its voltages, resistance, minutes and whether it browned out. Always asks first.
  level: confirm

battery_edit_run:
  describe: Correct a logged battery run. The author can for 24 hours; staff any time.
  level: confirm

battery_save:
  describe: Add a battery or change its label, brand, year, status or notes. Retiring a battery is a status change.
  level: confirm

battery_add_set:
  describe: Add a numbered set of batteries in one step, such as B01 through B12. Staff only.
  level: confirm

# ledger 0024 (0032). No reverse: the members changed may have had different
# statuses before, so it is confirm, and the preview lists every name.
admin_set_member_status_bulk:
  describe: Mark many members active, inactive or alumni in one change, with the reason.
  level: confirm

team_attendance_summary:
  describe: Every member with signed-in hours, check-ins, last check-in, logged hours, application and trip sign-ups.
  level: read

# ledger 0024 Part 2: a staff sign-in or sign-out (the quick pulse control).
# Undo, not confirm: the time defaults to now, so a preview and its confirm
# would carry different arguments; the reverse removes the one event added.
staff_add_event:
  describe: Add one check-in or check-out for a member at a time, with a reason (a forgotten tap, a staff sign-in).
  level: undo
  undo:
    - function: staff_void_event
      args:
        p_event: $result
        p_reason: Undo through Claude

# Role board v2 (0031, ledger 0023). Staff decisions are final: no
# eligibility check; every change previews first because a removal deletes.
staff_set_role_statuses:
  describe: Change many role board boxes at once - assign, back up, set to asked or remove members by name, for a slot or a whole day. Always asks first.
  level: confirm

staff_meet_team_fill:
  describe: Give every active student without a Meet a team slot one, spread evenly across the Meet a team boxes, skipping slots where they hold another role. Always asks first.
  level: confirm

team_connection_save:
  describe: Save a Meet a team note about another team at a competition. Always asks first.
  level: confirm

team_connection_delete:
  describe: Delete a Meet a team note. Always asks first.
  level: confirm

staff_set_request_status:
  describe: Mark one person in a role board box assigned, backup or asked, or remove them from it. Always asks first.
  level: confirm

staff_add_to_slot:
  describe: Put a member in a role board box who did not ask, as assigned or backup. Always asks first.
  level: confirm


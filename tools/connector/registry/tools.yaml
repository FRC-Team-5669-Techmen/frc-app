# THE HAND ENTRIES: the connector's own MCP tools, phone first.
#
# The only hand-written layer besides functions.yaml and exclusions.yaml.
# `npm run connector:build` compiles this into
# api/_lib/connector/registry.generated.json. Edit this file, never that one.
#
# Each tool:
#   describe   one sentence in his words (members, hours, sign-outs, events),
#              never a table or column name, under 200 characters
#   say        three or more ways he would actually say it
#   kind       read      reads as him through `read` steps, writes nothing
#              function  one database function, through connector_call at
#                        the function's level (functions.yaml or generated)
#   args       name -> {type, describe, required, enum, resolve}
#              resolve: member  -> a name or email, matched against the roster
#                       event   -> an event title or id, matched against the schedule
#                       signout -> a pending sign-out, matched by the member's name
#   function   (kind function) the database function, and `map` from tool
#              arguments to its arguments
#   The level and the undo of a function tool are its function entry's
#   (functions.yaml, or the generated one), never restated here.
#
# Anything here may only call a function the app already calls. Since ledger
# 0014 the app makes no direct table write (every page write is a function,
# src/writeVia.js), so every action the app has can have a tool here.
#
# map templates: $args.x (the tool argument as given), $resolved.x.y (a
# resolved member or event), $said, and $la.x (a time he said, read as Los
# Angeles wall-clock time and sent as an instant).

find_member:
  describe: Find a team member by name, nickname or email, with their roles and sub-teams.
  say: ["find Riley", "who is Sam Student", "look up the kid named Jordan", "what's Casey's email"]
  kind: read
  args:
    name: {type: string, describe: "A first name, nickname, last name or email", required: true}

list_members:
  describe: List team members with their roles, optionally only one role or only active members.
  say: ["list the team", "who are the mentors", "show me every student", "list the leads"]
  kind: read
  args:
    role: {type: string, describe: "Only members holding this role", enum: [student, mentor, lead, admin, parent]}
    status: {type: string, describe: "Only members with this status (active by default)", enum: [active, inactive, alumni, all]}

todays_signins:
  describe: Who checked in today, who is still in the shop, and which sign-outs are waiting.
  say: ["who's here today", "who signed in today", "who is still in the shop", "any sign-outs waiting"]
  kind: read
  args: {}

approve_signout:
  describe: Approve a member's pending sign-out request; their hours stop now. Reads the note they wrote.
  say: ["approve Riley's sign-out", "sign Sam out", "okay Jordan's sign out", "approve the sign-out from Casey"]
  kind: function
  function: approve_signout
  args:
    member: {type: string, describe: "Whose pending sign-out to approve (a name)", required: true, resolve: signout}
  map:
    p_request: $resolved.member.request_id

member_hours:
  describe: A member's hours this week against what is required, their standing, and this month's meetings.
  say: ["how many hours does Riley have", "what are Sam's hours this week", "is Jordan on track", "check Casey's standing"]
  kind: read
  args:
    member: {type: string, describe: "The member (a name or email)", required: true, resolve: member}

correct_hours:
  describe: Add or take away hours for a member, in one category, with the reason. Taking hours away always asks first.
  say: ["give Riley two build hours for the Saturday fix", "add an hour of outreach to Sam for the library demo", "take half an hour off Jordan, double counted", "credit Casey three volunteer hours"]
  kind: function
  function: staff_add_hour_adjustment
  args:
    member: {type: string, describe: "The member (a name or email)", required: true, resolve: member}
    hours: {type: number, describe: "Hours to add; negative to take away", required: true}
    category: {type: string, describe: "Which kind of hours", required: true, enum: [build, outreach, volunteer, competition]}
    reason: {type: string, describe: "Why, in his words; it is shown to the member", required: true}
  map:
    p_member: $resolved.member.id
    p_category: $args.category
    p_hours: $args.hours
    p_reason: $args.reason

list_events:
  describe: The team schedule between two dates (this week and next by default).
  say: ["what's on the schedule", "what's happening this week", "list next week's events", "when is the next build"]
  kind: read
  args:
    from: {type: string, describe: "First day, YYYY-MM-DD (today by default)"}
    to: {type: string, describe: "Last day, YYYY-MM-DD (two weeks from the first by default)"}

create_event:
  describe: Add an event to the team schedule, times in Los Angeles time. It reaches Discord and phones like any event; undo deletes it.
  say: ["add a build Saturday 9 to 1", "schedule a meeting Tuesday at lunch", "put the outreach event on the calendar", "add a potluck on the 14th at 6"]
  kind: function
  function: schedule_create_event
  args:
    title: {type: string, describe: "What the event is called", required: true}
    kind: {type: string, describe: "What kind of event", required: true, enum: [build, meeting, competition, potluck, outreach, volunteering, training, other]}
    start: {type: string, describe: "When it starts, YYYY-MM-DD HH:MM, Los Angeles time", required: true}
    end: {type: string, describe: "When it ends, YYYY-MM-DD HH:MM, Los Angeles time", required: true}
    location: {type: string, describe: "Where it is"}
    notes: {type: string, describe: "Notes shown on the event"}
  map:
    p_title: $args.title
    p_kind: $args.kind
    p_starts_at: $la.start
    p_ends_at: $la.end
    p_location: $args.location
    p_notes: $args.notes

event_signups:
  describe: Who said going, maybe or not going to an event.
  say: ["who's coming Saturday", "who signed up for the outreach event", "how many are going to the build", "who said maybe"]
  kind: read
  args:
    event: {type: string, describe: "The event (a title, a date, or its id)", required: true, resolve: event}

trip_boards:
  describe: The carpool and food boards for a trip, as staff see them.
  say: ["show the Beach Blitz carpool", "who is driving to the competition", "what food is still needed for the trip", "carpool board"]
  kind: read
  args:
    trip: {type: string, describe: "The trip (a title); the next one when not said"}
    full: {type: boolean, describe: "true for the whole board with phones, pickups and allergy detail; a summary otherwise"}

send_family_link:
  describe: Email a family their trip sign-up link again, to every email on the family or one of them. Always asks first.
  say: ["send Joseph Tran's family their Beach Blitz link", "resend the trip link to Riley's mom", "the Tran family needs their sign-up link again", "email Sam's parents the carpool form link"]
  kind: function
  function: staff_send_trip_link
  args:
    student: {type: string, describe: "The student whose family it is (a name)", required: true, resolve: member}
    trip: {type: string, describe: "Part of the trip title, when the student is on more than one coming trip"}
    email: {type: string, describe: "Only this one email on the family; every email when not said"}
  map:
    p_student: $resolved.student.id
    p_trip: $args.trip
    p_email: $args.email

parent_responses:
  describe: Parent questionnaire answers this season (supervision, meals, driving, employer, donation), one line per family.
  say: ["what did the parents say", "which parents can drive", "who offered to help with meals", "parent form responses"]
  kind: read
  args:
    member: {type: string, describe: "Only this student's family (a name)", resolve: member}

set_team_role:
  describe: Give a member a team role or take one away. Taking a role away always asks first.
  say: ["make Riley a lead", "give Sam the mentor role", "take lead off Jordan", "make Casey a student again"]
  kind: function
  function: admin_set_member_role
  args:
    member: {type: string, describe: "The member (a name or email)", required: true, resolve: member}
    role: {type: string, describe: "The role", required: true, enum: [student, mentor, lead, admin, parent]}
    grant: {type: boolean, describe: "true to give the role, false to take it away", required: true}
  map:
    p_member: $resolved.member.id
    p_role: $args.role
    p_grant: $args.grant

set_member_name:
  describe: Fix the real name a member shows under on the roster, and their nickname if he says one. Undo puts the old name back.
  say: ["Riley's real name is Riley Ortega", "change Sam's name to Samuel Diaz", "fix the spelling of Casey's last name", "set Jordan's nickname to JJ"]
  kind: function
  function: admin_set_member_name
  args:
    member: {type: string, describe: "The member (a name or email)", required: true, resolve: member}
    full_name: {type: string, describe: "Their full real name, first and last", required: true}
    nickname: {type: string, describe: "Their nickname, only when he says one; empty clears it"}
  map:
    p_member: $resolved.member.id
    p_full_name: $args.full_name
    p_nickname: $args.nickname

merge_accounts:
  describe: Move everything a duplicate account has (a summer Gmail login) onto the member's real school account. Always asks first.
  say: ["merge Riley's Gmail account into her school account", "Sam has two accounts, move the old one into the school one", "combine Jordan's accounts", "move everything from the personal email to the school email"]
  kind: function
  function: admin_merge_member
  args:
    from: {type: string, describe: "The duplicate account to merge away (a name or email)", required: true, resolve: member}
    into: {type: string, describe: "The account to keep, usually the school email", required: true, resolve: member}
    reason: {type: string, describe: "Why, in his words", required: true}
  map:
    p_from: $resolved.from.id
    p_into: $resolved.into.id
    p_reason: $args.reason

feedback_inbox:
  describe: The app feedback inbox, newest first, with who sent it and its status.
  say: ["any new feedback", "what bugs came in", "read the feedback inbox", "show feedback marked in progress"]
  kind: read
  args:
    status: {type: string, describe: "Only this status (new by default)", enum: [new, seen, in_progress, done, wont_do, spam, all]}
    limit: {type: integer, describe: "How many (10 by default, at most 50)"}

feedback_set_status:
  describe: Move feedback reports to a status (seen, in progress, done, won't do, spam, back to new). Undo puts them back.
  say: ["mark that feedback done", "move those three to in progress", "mark the bug report seen", "that one is spam"]
  kind: function
  function: feedback_set_status
  args:
    ids: {type: array, items: string, describe: "The report ids from feedback_inbox", required: true}
    status: {type: string, describe: "The status to move them to", required: true, enum: [new, seen, in_progress, done, wont_do, spam]}
  map:
    p_ids: $args.ids
    p_status: $args.status

feedback_reply:
  describe: Not available through Claude yet (the inbox has no reply). Says so; report_gap files it.
  say: ["reply to that feedback", "tell Riley we fixed it", "answer the bug report"]
  kind: unavailable
  gap: "The feedback inbox has no reply or comment: no table, no function and no page sends one."
  args: {}

report_gap:
  describe: File what the app cannot do to the feedback inbox, marked from the connector, so it gets built.
  say: ["the app can't do that, log it", "file that as a missing feature", "remember we need a seating chart"]
  kind: function
  function: connector_report_gap
  args:
    what_is_missing: {type: string, describe: "What the app could not do, in plain words", required: true}
  map:
    p_said: $said
    p_missing: $args.what_is_missing

undo_last:
  describe: Undo the newest change made through Claude that can be undone.
  say: ["undo that", "take that back", "undo the last change"]
  kind: builtin
  args: {}

find_tool:
  describe: Find the app action for something not covered by a named tool; answers how to call it with call_app.
  say: ["is there a way to void a session", "can you log a safety violation", "how do I remind families to sign up"]
  kind: builtin
  args:
    query: {type: string, describe: "What he wants done, in his words", required: true}

call_app:
  describe: Run any app action find_tool named, as him. Reads run at once; changes preview first when they ask first.
  say: ["void Sam's last session", "log a safety violation for Riley", "remind the families"]
  kind: builtin
  args:
    name: {type: string, describe: "The action name find_tool gave", required: true}
    args: {type: object, describe: "Its arguments, by the names find_tool gave", required: true}

scouting_event:
  describe: Read an event's scouting records, personal pick lists and message delivery states.
  say: ["show scouting for Beach Blitz", "what do we know about these robots", "check our scouting notes"]
  kind: read
  args:
    event: {type: string, describe: "The calendar event name or id", required: true, resolve: event}

preview_scouting_import:
  describe: Preview event teams, match schedules and estimates, or read the Nexus pit map, without saving changes.
  say: ["preview the Beach Blitz team import", "fetch the scouting event data", "look up this event's teams and matches"]
  kind: read
  args:
    event: {type: string, describe: "The calendar event name or id", required: true, resolve: event}
    event_key: {type: string, describe: "The provider event key, such as 2026dal", required: true}
    mode: {type: string, describe: "Use pit_map for read-only Nexus geometry; omit for the manager-only team import", enum: [pit_map]}

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0B0D" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Techmen" />
    <!-- The icon set (tools/icons/build-icons.mjs, the same shape as idea-app). -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Techmen · 5669</title>
    <!-- Theme before first paint (src/themeMode.js resolveTheme, duplicated
         here on purpose; tests/theme-mode.test.js runs this script and holds
         it equal). Dark unless the person chose Light, or System on a light
         device. Imports nothing, so /checkin stays light. -->
    <script id="theme-boot">(function(){var t='dark';try{var c=localStorage.getItem('techmen:theme');if(c==='light'||(c==='system'&&matchMedia('(prefers-color-scheme: light)').matches))t='light'}catch(e){}document.documentElement.setAttribute('data-theme',t);if(t==='light'){var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content','#FFFFFF')}})()</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
